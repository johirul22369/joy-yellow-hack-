<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JOHIRUL WINGO PREDICTOR</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&family=Hind+Siliguri:wght@600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100vh;
            background: #0a0518;
            overflow: hidden;
            font-family: 'Hind Siliguri', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* মূল প্রেডিক্টর প্যানেল - রেফারেন্স অনুযায়ী ডার্ক ব্যাকগ্রাউন্ড ও উজ্জ্বল বর্ডার */
        .predictor-card {
            width: 360px;
            background: linear-gradient(180deg, #150a2e 0%, #090314 100%);
            border: 3px solid;
            border-image: linear-gradient(135deg, #ff007f, #00f0ff, #9d00ff) 1;
            border-radius: 32px;
            padding: 20px;
            box-shadow: 0 0 50px rgba(255, 0, 127, 0.4), 0 0 25px rgba(0, 240, 255, 0.3);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
        }

        /* হেডার সেকশন */
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .brand-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            position: relative;
        }

        .crown-icon {
            font-size: 24px;
            color: #ffd700;
            filter: drop-shadow(0 0 8px #ffd700);
            margin-bottom: -6px;
        }

        .brand-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(0deg, #ff007f, #ffffff, #00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 12px rgba(255, 0, 127, 0.8), 0 0 20px rgba(0, 240, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
        }

        .wing-ornament {
            display: inline-flex;
            gap: 4px;
            font-size: 18px;
            align-items: center;
        }

        .hide-badge {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }

        /* গেম মোড ও পিরিয়ড বার */
        .game-info-bar {
            background: linear-gradient(90deg, #1e1b4b, #312e81);
            border: 2px solid #6366f1;
            border-radius: 16px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: inset 0 0 15px rgba(99, 102, 241, 0.5);
        }

        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 900;
            color: #34d399;
            text-shadow: 0 0 8px #34d399;
        }

        .period-display {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .period-label {
            font-size: 9px;
            color: #94a3b8;
            font-weight: 700;
            text-transform: uppercase;
        }

        .period-value {
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        /* প্রেডিকশন ডিসপ্লে এরিয়া */
        .prediction-box {
            background: radial-gradient(circle, #3b0764 0%, #0f0226 100%);
            border: 3px solid #d946ef;
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            position: relative;
            box-shadow: inset 0 0 25px rgba(217, 70, 239, 0.6), 0 0 30px rgba(217, 70, 239, 0.4);
        }

        .status-badge {
            position: absolute;
            top: 12px;
            left: 16px;
            background: #10b981;
            color: #ffffff;
            font-size: 10px;
            font-weight: 900;
            padding: 3px 10px;
            border-radius: 12px;
            text-transform: uppercase;
            box-shadow: 0 0 12px #10b981;
            letter-spacing: 0.5px;
        }

        .prediction-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 60px;
            font-weight: 900;
            color: #00f0ff;
            text-shadow: 0 0 25px rgba(0, 240, 255, 0.9), 0 0 50px rgba(0, 240, 255, 0.6);
            margin: 12px 0;
            letter-spacing: 3px;
        }

        /* BIG এর জন্য পিঙ্কিশ কালার */
        .prediction-big {
            color: #ff007f !important;
            text-shadow: 0 0 25px rgba(255, 0, 127, 0.9), 0 0 50px rgba(255, 0, 127, 0.6) !important;
        }

        .range-info {
            display: flex;
            justify-content: space-around;
            padding: 0 10px;
        }

        .range-item {
            background: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 14px;
            padding: 6px 20px;
            border-radius: 16px;
            border: 2px solid #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .range-big {
            border: 2px solid #ff007f !important;
            box-shadow: 0 0 12px rgba(255, 0, 127, 0.4) !important;
        }

        /* পরবর্তী রাউন্ড কাউন্টডাউন */
        .next-countdown {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border: 2px solid #475569;
            border-radius: 18px;
            padding: 8px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .next-text {
            font-size: 11px;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .timer-box {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 900;
            color: #34d399;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-shadow: 0 0 10px #34d399;
        }

        /* পূর্ববর্তী রেজাল্ট হিস্ট্রি সার্কেল - রেফারেন্সের মতো গাঢ় ও রঙিন বর্ডার */
        .results-section {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 12px;
            text-align: center;
        }

        .results-title {
            font-size: 11px;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .circles-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .result-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 13px;
            color: #ffffff;
            box-shadow: 0 0 8px rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.2);
        }

        /* রেফারেন্সের সঠিক কালার স্কিম অনুযায়ী সার্কেল ব্যাকগ্রাউন্ড */
        .circle-small { background: #00bcd4; } /* Teal/Cyan for Small */
        .circle-big { background: #e91e63; }   /* Pink/Magenta for Big */
        .circle-violet { background: #9c27b0; } /* Violet if needed */

        /* জয়েন নাও অ্যাকশন বাটন */
        .join-btn-container {
            margin-top: 4px;
        }

        .join-link-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #ff0055, #ff5500);
            border: 2px solid #ffcc00;
            border-radius: 24px;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 18px;
            font-weight: 900;
            text-align: center;
            text-decoration: none;
            text-transform: uppercase;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.6);
            transition: transform 0.1s, box-shadow 0.2s;
            cursor: pointer;
            letter-spacing: 1px;
        }

        .join-link-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="predictor-card">
        <!-- হেডার: ক্রাউন ও স্টাইলাইজড ব্র্যান্ড নেম -->
        <div class="panel-header">
            <div class="brand-area">
                <div class="crown-icon">👑</div>
                <div class="brand-title">
                    <span class="wing-ornament">🌿✨</span> JOHIRUL <span class="wing-ornament">✨🌿</span>
                </div>
            </div>
            <button class="hide-badge"><span>👁️</span> HIDE</button>
        </div>

        <!-- গেম মোড ও পিরিয়ড -->
        <div class="game-info-bar">
            <span class="game-title">30 SEC PREDICTOR V2</span>
            <div class="period-display">
                <span class="period-label">NO:</span>
                <span class="period-value">20261102100052214</span>
            </div>
        </div>

        <!-- প্রেডিকশন উইন্ডো -->
        <div class="prediction-box">
            <span class="status-badge">PREDICTED</span>
            <!-- BIG সিগন্যাল দেখাতে হলে prediction-text ক্লাসে prediction-big যোগ করবি -->
            <div class="prediction-text">SMALL</div>
            
            <div class="range-info">
                <div class="range-item">SMALL 0-4</div>
                <div class="range-item range-big">BIG 5-9</div>
            </div>
        </div>

        <!-- নেক্সট রাউন্ড কাউন্টডাউন -->
        <div class="next-countdown">
            <div class="next-text">NEXT IN</div>
            <div class="timer-box">
                <span>⏱️</span> <span>00 : 23</span>
            </div>
        </div>

        <!-- সাম্প্রতিক রেজাল্ট হিস্ট্রি সার্কেল -->
        <div class="results-section">
            <div class="results-title">RECENT LATEST RESULTS</div>
            <div class="circles-row">
                <div class="result-circle circle-big">8</div>
                <div class="result-circle circle-small">4</div>
                <div class="result-circle circle-small">3</div>
                <div class="result-circle circle-small">2</div>
                <div class="result-circle circle-big">9</div>
                <div class="result-circle circle-big">6</div>
                <div class="result-circle circle-big">0</div>
                <div class="result-circle circle-big">8</div>
                <div class="result-circle circle-big">7</div>
            </div>
        </div>

        <!-- জয়েন নাও অ্যাকশন বাটন -->
        <div class="join-btn-container">
            <a href="https://hgnice0.com/#/register?invitationCode=376851951983" class="join-link-btn">PLAY SMARTER</a>
        </div>
    </div>

</body>
</html>
